<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <!-- Main body gradient: deep blue to bright blue (ribbon 3D effect) -->
    <linearGradient id="pBodyGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e6fff"/>
      <stop offset="45%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1a4fc9"/>
    </linearGradient>
    <!-- Ribbon highlight gradient: light cyan/sky to transparent -->
    <linearGradient id="pRibbonHi" x1="0" y1="0" x2="1" y2="0.6">
      <stop offset="0%" stop-color="#60c8ff" stop-opacity="0.95"/>
      <stop offset="60%" stop-color="#3ba0ff" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#2563eb" stop-opacity="0"/>
    </linearGradient>
    <!-- Ribbon shadow gradient -->
    <linearGradient id="pRibbonSh" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1240a8"/>
      <stop offset="100%" stop-color="#0d2f7a"/>
    </linearGradient>
    <!-- Bubble gradient (white oval for checkmark area) -->
    <radialGradient id="bubbleGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e8f1ff"/>
    </radialGradient>
    <!-- Drop shadow -->
    <filter id="dropShadow" x="-10%" y="-5%" width="130%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#1a3f9f" flood-opacity="0.35"/>
    </filter>
  </defs>

  <g filter="url(#dropShadow)">
    <!--
      "P" shape: a stylised letterform with:
      - left swept tail (the curl at bottom-left)
      - upper loop (the bowl of P) 
      The outline path traces the full logo mark clockwise.
      
      Breakdown of the shape from the reference images:
      - The tail sweeps left and down from the main vertical stroke
      - The bowl forms a large circular right half
      - A white speech-bubble oval sits in the bowl centre
    -->

    <!-- MAIN P BODY -->
    <path
      d="
        M 28 95
        C 15 90, 10 78, 14 66
        C 18 55, 24 50, 30 46
        L 30 28
        C 30 16, 38 8, 56 8
        C 76 8, 92 20, 92 42
        C 92 62, 76 74, 56 74
        L 46 74
        L 46 85
        C 46 94, 40 102, 32 102
        C 30 102, 28 100, 28 95
        Z
      "
      fill="url(#pBodyGrad)"
    />

    <!-- RIBBON HIGHLIGHT (top-left bright curved streak giving 3D ribbon look) -->
    <path
      d="
        M 32 20
        C 38 10, 52 7, 62 10
        C 52 10, 42 15, 36 26
        Z
      "
      fill="url(#pRibbonHi)"
      opacity="0.85"
    />

    <!-- RIBBON HIGHLIGHT secondary sweep on bowl outer edge -->
    <path
      d="
        M 68 10
        C 84 16, 93 28, 92 42
        C 92 32, 86 20, 72 13
        Z
      "
      fill="#60c8ff"
      opacity="0.45"
    />

    <!-- LOWER TAIL SHADOW SHADING (darker underside of tail sweep) -->
    <path
      d="
        M 28 72
        C 18 74, 12 80, 14 88
        C 16 96, 22 100, 28 95
        C 26 90, 24 83, 28 72
        Z
      "
      fill="url(#pRibbonSh)"
      opacity="0.6"
    />

    <!-- SPEECH BUBBLE / OVAL (white area in the bowl) -->
    <ellipse
      cx="62"
      cy="41"
      rx="22"
      ry="18"
      fill="url(#bubbleGrad)"
    />

    <!-- CHECKMARK inside bubble -->
    <path
      d="M 51 41 L 59 50 L 74 32"
      stroke="#2563eb"
      stroke-width="5.5"
      stroke-linecap="round"
      stroke-linejoin="round"
      fill="none"
    />
  </g>
</svg>
