<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 100" fill="none">
  <defs>
    <linearGradient id="pBodyGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e6fff"/>
      <stop offset="45%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1a4fc9"/>
    </linearGradient>
    <linearGradient id="pRibbonHi" x1="0" y1="0" x2="1" y2="0.6">
      <stop offset="0%" stop-color="#60c8ff" stop-opacity="0.95"/>
      <stop offset="60%" stop-color="#3ba0ff" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#2563eb" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="pRibbonSh" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1240a8"/>
      <stop offset="100%" stop-color="#0d2f7a"/>
    </linearGradient>
    <radialGradient id="bubbleGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e8f1ff"/>
    </radialGradient>
    <!-- AI badge gradient -->
    <linearGradient id="aiBadgeGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-5%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1a3f9f" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- ── MARK (scaled to fit 100px tall canvas) ── -->
  <g transform="translate(4, 4) scale(0.78)" filter="url(#dropShadow)">
    <!-- P body -->
    <path
      d="M 28 95 C 15 90, 10 78, 14 66 C 18 55, 24 50, 30 46 L 30 28 C 30 16, 38 8, 56 8 C 76 8, 92 20, 92 42 C 92 62, 76 74, 56 74 L 46 74 L 46 85 C 46 94, 40 102, 32 102 C 30 102, 28 100, 28 95 Z"
      fill="url(#pBodyGrad)"
    />
    <!-- Ribbon highlight -->
    <path d="M 32 20 C 38 10, 52 7, 62 10 C 52 10, 42 15, 36 26 Z" fill="url(#pRibbonHi)" opacity="0.85"/>
    <path d="M 68 10 C 84 16, 93 28, 92 42 C 92 32, 86 20, 72 13 Z" fill="#60c8ff" opacity="0.45"/>
    <!-- Tail shadow -->
    <path d="M 28 72 C 18 74, 12 80, 14 88 C 16 96, 22 100, 28 95 C 26 90, 24 83, 28 72 Z" fill="url(#pRibbonSh)" opacity="0.6"/>
    <!-- Bubble -->
    <ellipse cx="62" cy="41" rx="22" ry="18" fill="url(#bubbleGrad)"/>
    <!-- Checkmark -->
    <path d="M 51 41 L 59 50 L 74 32" stroke="#2563eb" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>

  <!-- ── VERTICAL DIVIDER ── -->
  <line x1="92" y1="18" x2="92" y2="82" stroke="#1e3a6e" stroke-width="1.5" stroke-linecap="round"/>

  <!-- ── WORDMARK "PayResolve" ── -->
  <text
    x="106"
    y="64"
    font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif"
    font-size="36"
    font-weight="800"
    fill="#132d5e"
    letter-spacing="-1"
  >PayResolve</text>

  <!-- ── "AI" BADGE ── -->
  <rect x="348" y="30" width="56" height="36" rx="8" fill="url(#aiBadgeGrad)"/>
  <text
    x="376"
    y="56"
    font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif"
    font-size="20"
    font-weight="800"
    fill="#ffffff"
    text-anchor="middle"
    letter-spacing="0.5"
  >AI</text>
</svg>
