name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Cancel previous runs for the same branch on new pushes
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend Build & Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: payresolve
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Prepare application configuration
        run: cp backend/src/main/resources/application.yml.example backend/src/main/resources/application.yml

      - name: Run Maven verification
        env:
          DATABASE_URL: jdbc:postgresql://localhost:5432/payresolve
          DB_USER: postgres
          DB_PASSWORD: postgres_ci_password
          PAYPAL_CLIENT_ID: mock_ci_client_id
          PAYPAL_CLIENT_SECRET: mock_ci_secret
          PAYPAL_WEBHOOK_ID: mock_ci_webhook_id
        run: |
          cd backend
          chmod +x mvnw
          ./mvnw verify -B

  frontend:
    name: Frontend Lint & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: Lint frontend
        run: |
          cd frontend
          npm run lint

      - name: Build frontend
        run: |
          cd frontend
          npm run build

  check-env-names:
    name: Env Name Consistency Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check env variable name consistency
        run: node scripts/check-env-names.mjs

  api-tests:
    name: API Integration Tests (Postman & Newman)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: payresolve
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Prepare application configuration
        run: cp backend/src/main/resources/application.yml.example backend/src/main/resources/application.yml

      - name: Build backend JAR
        run: |
          cd backend
          chmod +x mvnw
          ./mvnw package -DskipTests -B

      - name: Start PayResolve Backend
        env:
          DATABASE_URL: jdbc:postgresql://localhost:5432/payresolve
          DB_USER: postgres
          DB_PASSWORD: postgres_ci_password
          DEMO_MODE: 'true'
          FLYWAY_ENABLED: 'true'
          SERVER_PORT: '8080'
          SESSION_COOKIE_SECURE: 'false'
          PAYPAL_CLIENT_ID: mock_ci_client_id
          PAYPAL_CLIENT_SECRET: mock_ci_secret
          PAYPAL_WEBHOOK_ID: mock_ci_webhook_id
          GROQ_API_KEY: mock_ci_groq_key
          GEMINI_API_KEY: mock_ci_gemini_key
        run: |
          cd backend
          JAR=$(ls target/payresolve-*.jar | grep -v 'original' | head -n 1)
          echo "Starting jar: $JAR"
          nohup java -Djava.net.preferIPv4Stack=true -jar "$JAR" > ../backend.log 2>&1 &

      - name: Wait for Backend Health
        run: |
          for i in {1..45}; do
            if curl -s http://127.0.0.1:8080/actuator/health | grep -q '"status":"UP"'; then
              echo "Backend is healthy!"
              exit 0
            fi
            echo "Waiting for backend ($i/45)..."
            sleep 2
          done
          echo "Backend failed to become healthy within 90s. Log output:"
          cat backend.log
          exit 1

      - name: Run Postman Offline Suite with Newman
        run: |
          npx --yes newman run postman/PayResolve.postman_collection.json \
            --folder offline \
            --reporters cli,json \
            --reporter-json-export postman-report.json

      - name: Upload Newman Test Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: postman-api-test-report
          path: postman-report.json
          if-no-files-found: warn

