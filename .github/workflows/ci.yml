name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Cancel previous runs for the same branch on new pushes
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend Build & Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: payresolve
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Prepare application configuration
        run: cp backend/src/main/resources/application.yml.example backend/src/main/resources/application.yml

      - name: Run Maven verification
        env:
          DATABASE_URL: jdbc:postgresql://localhost:5432/payresolve
          DB_USER: postgres
          DB_PASSWORD: postgres_ci_password
          TESTCONTAINERS_RYUK_DISABLED: 'true'
          PAYPAL_CLIENT_ID: mock_ci_client_id
          PAYPAL_CLIENT_SECRET: mock_ci_secret
          PAYPAL_WEBHOOK_ID: mock_ci_webhook_id
        run: |
          cd backend
          chmod +x mvnw
          ./mvnw verify -B

  frontend:
    name: Frontend Lint & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: Lint frontend
        run: |
          cd frontend
          npm run lint

      - name: Build frontend
        run: |
          cd frontend
          npm run build

  check-env-names:
    name: Env Name Consistency Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check env variable name consistency
        run: node scripts/check-env-names.mjs

  api-tests:
    name: API Integration Tests (Postman & Newman)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: payresolve
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Prepare application configuration
        run: cp backend/src/main/resources/application.yml.example backend/src/main/resources/application.yml

      - name: Build backend JAR
        run: |
          cd backend
          chmod +x mvnw
          ./mvnw package -DskipTests -B

      - name: Start Backend and Run API Integration Tests
        env:
          DATABASE_URL: jdbc:postgresql://localhost:5432/payresolve
          DB_USER: postgres
          DB_PASSWORD: postgres_ci_password
          DEMO_MODE: 'true'
          FLYWAY_ENABLED: 'true'
          SERVER_PORT: '8080'
          SESSION_COOKIE_SECURE: 'false'
          PAYPAL_CLIENT_ID: mock_ci_client_id
          PAYPAL_CLIENT_SECRET: mock_ci_secret
          PAYPAL_WEBHOOK_ID: mock_ci_webhook_id
          GROQ_API_KEY: mock_ci_groq_key
          GEMINI_API_KEY: mock_ci_gemini_key
        run: |
          cd backend
          JAR=$(ls target/payresolve-*.jar | grep -v 'original' | head -n 1)
          echo "Starting jar: $JAR"
          java -Djava.net.preferIPv4Stack=true -jar "$JAR" > ../backend.log 2>&1 &
          SERVER_PID=$!
          cd ..

          echo "Waiting for PayResolve Backend health..."
          HEALTHY=false
          for i in {1..45}; do
            if curl -s http://127.0.0.1:8080/actuator/health | grep -q '"status":"UP"'; then
              echo "Backend is healthy!"
              HEALTHY=true
              break
            fi
            echo "Waiting for backend ($i/45)..."
            sleep 2
          done

          if [ "$HEALTHY" != "true" ]; then
            echo "Backend failed to become healthy within 90s. Log output:"
            cat backend.log
            kill $SERVER_PID 2>/dev/null || true
            exit 1
          fi

          echo "Seeding canonical demo cases and running initial benchmark for offline API tests..."
          curl -s -X POST http://127.0.0.1:8080/api/cases/seed
          curl -s -X POST http://127.0.0.1:8080/api/benchmark/run

          echo "Running Newman offline suite..."
          npx --yes newman run postman/PayResolve.postman_collection.json \
            --folder offline \
            --reporters cli,json \
            --reporter-json-export postman-report.json

          node -e "
            const fs = require('fs');
            if (fs.existsSync('postman-report.json') && process.env.GITHUB_STEP_SUMMARY) {
              const r = JSON.parse(fs.readFileSync('postman-report.json', 'utf8'));
              const s = r.run?.stats || {};
              const lines = [
                '### Postman & Newman Offline Suite Summary',
                '| Metric | Total | Failed |',
                '|---|---|---|',
                '| Requests | ' + (s.requests?.total ?? 0) + ' | ' + (s.requests?.failed ?? 0) + ' |',
                '| Assertions | ' + (s.assertions?.total ?? 0) + ' | ' + (s.assertions?.failed ?? 0) + ' |',
                '| Test Scripts | ' + (s.testScripts?.total ?? 0) + ' | ' + (s.testScripts?.failed ?? 0) + ' |'
              ];
              fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join('\n') + '\n');
            }
          "

          kill $SERVER_PID 2>/dev/null || true

      - name: Upload Newman Test Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: postman-api-test-report
          path: postman-report.json
          if-no-files-found: warn

